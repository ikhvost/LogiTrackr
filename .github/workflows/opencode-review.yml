name: opencode-review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  review:
    runs-on: ubuntu-latest
    environment: opencode
    permissions:
      id-token: write
      contents: read
      pull-requests: write
      issues: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: anomalyco/opencode/github@latest
        env:
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: zai-coding-plan/glm-4.7
          use_github_token: true
          prompt: |
            You are a senior code reviewer ensuring high standards of code quality and security.

            ## Instructions
            1. Run git diff to see recent changes
            2. Focus on modified files
            3. Begin review immediately

            ## Review Checklist
            - Code is simple and readable
            - Functions and variables are well-named
            - No duplicated code
            - Proper error handling
            - No exposed secrets or API keys
            - Input validation implemented
            - Good test coverage
            - Performance considerations addressed

            ## Response Format

            Organize your feedback BY FILE. Use the following structure to ensure maximum readability:

            ---

            # 📄 `path/to/file.tsx`

            ## 🚨 Critical Issues (Must Fix)

            #### 📍 Line XX: Brief Issue Title
            **Problem:** Detailed explanation of the bug or security risk.
            ```tsx
            // Current code snippets are encouraged
            ```
            **Fix:**
            ```tsx
            // Provide exact code to copy-paste
            ```

            ---

            ## ⚠️ Warnings (Should Fix)

            #### 📍 Line XX: Brief Issue Title
            - **Issue:** Concise description.
            - **Recommendation:** Clear action steps.

            ---

            ## 💡 Suggestions (Consider Improving)

            #### 📍 Line XX: Brief Issue Title
            - **Observation:** Context on why this caught your eye.
            - **Improvement:** How to make it cleaner/better.

            ---

            ## ✅ Good Patterns
            - Praise specific implementations here.

            ---

            # 📊 Summary Table

            | Severity | Count | issues |
            |----------|-------|--------|
            | 🚨 Critical | X | Summarize here |
            | ⚠️ Warnings | X | Summarize here |
            | 💡 Suggestions | X | Summarize here |

            ---
            **Note:** ALWAYS separate each individual finding with a horizontal rule (`---`) if they are in the same category. Skip categories that have no issues.