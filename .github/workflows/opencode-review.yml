name: opencode-review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  review:
    runs-on: ubuntu-latest
    environment: opencode
    permissions:
      id-token: write
      contents: read
      pull-requests: write
      issues: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: anomalyco/opencode/github@latest
        env:
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: zai-coding-plan/glm-4.7
          use_github_token: true
          prompt: |
            You are a senior code reviewer ensuring high standards of code quality and security.

            ## Instructions
            1. Run git diff to see recent changes
            2. Focus on modified files
            3. Begin review immediately

            ## Review Checklist
            - Code is simple and readable
            - Functions and variables are well-named
            - No duplicated code
            - Proper error handling
            - No exposed secrets or API keys
            - Input validation implemented
            - Good test coverage
            - Performance considerations addressed

            ## Response Format

            Organize your feedback BY FILE with clear sections:

            ---

            ## `path/to/file.tsx`

            ### 🚨 Critical Issues (Must Fix)

            **Line XX:** Brief issue title
            ```tsx
            // Current code
            problematic code here
            ```
            **Problem:** Explanation of why this is critical.
            **Fix:**
            ```tsx
            // Suggested fix
            corrected code here
            ```

            ---

            ### ⚠️ Warnings (Should Fix)

            **Line XX:** Brief issue title
            - Problem explanation
            - Suggested improvement

            ---

            ### 💡 Suggestions (Consider Improving)

            **Line XX:** Brief issue title
            - Why this could be better
            - Optional improvement idea

            ---

            ### ✅ Good Patterns

            Highlight any well-written code worth praising.

            ---

            ## Summary

            | Severity | Count |
            |----------|-------|
            | 🚨 Critical | X |
            | ⚠️ Warnings | X |
            | 💡 Suggestions | X |

            Keep feedback actionable, specific, and easy to navigate.